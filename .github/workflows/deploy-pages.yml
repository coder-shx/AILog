name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build static demo
        run: corepack pnpm --filter @ailog/web build
        env:
          VITE_BASE_PATH: /AILog/
          VITE_STATIC_DEMO: "true"

      - name: Add SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../ailog-pages
          cp -R apps/web/dist/. ../ailog-pages/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -R ../ailog-pages/. .
          touch .nojekyll
          git add .
          git commit -m "Deploy AILog static site"
          git push --force origin gh-pages
